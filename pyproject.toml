[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-video-events"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.12",
  "av>=16,<17", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5",
  "ultralytics>=8.3,<9", "torch>=2.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
